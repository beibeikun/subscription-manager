name: Validate
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t subscription-manager:1.0.0 .
      - run: node scripts/container-smoke.mjs subscription-manager:1.0.0 "linux/$( [ $(uname -m) = aarch64 ] && echo arm64 || echo amd64 )"
